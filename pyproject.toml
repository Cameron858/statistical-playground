[project]
name = "statistical-playground"
version = "0.1.0"
description = "Examples of statistical hypothesis testing in Python, including t-tests and ANOVA."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jupyterlab>=4.4.3",
    "jupyterlab-git>=0.51.2",
    "jupyterlab-lsp>=5.1.1",
    "matplotlib>=3.10.3",
    "numpy>=2.2.6",
    "pandas>=2.3.0",
    "pre-commit>=4.2.0",
    "pyprojroot>=0.3.0",
    "python-lsp-server[all]>=1.12.2",
    "scikit-learn>=1.7.0",
    "scipy>=1.15.3",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.4",
]
